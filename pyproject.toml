[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vedio-rsi-fastroll"
version = "0.1.0"
description = "A durable, work-conserving rollout execution harness for video optimization agents"
requires-python = ">=3.11"

[project.scripts]
fastroll = "fastroll.cli:main"

[tool.setuptools.packages.find]
include = ["fastroll*"]
