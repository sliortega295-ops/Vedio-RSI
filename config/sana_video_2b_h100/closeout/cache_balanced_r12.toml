id = "sana_video_2b_h100_closeout_cache_balanced_r12"
kind = "methodology"
purpose = "closeout_sanity"
description = "Verified balanced EasyCache R12 point with every Kernel optimization disabled."
model_profile = "sana_video_2b_h100"

[runtime]
root = "models/sana_video_2b_h100/baseline"
python = "/home/jiangzhikun/yongyan_liu/Experiments/SolAgent/20260827-official-repro/envs/sana-cu128-phase0/bin/python"

[env]
SANA_ENABLE_COMPILE = "0"
SANA_ENABLE_MAX_AUTOTUNE = "0"
SANA_ENABLE_LINATTN_BF16 = "0"
SANA_ENABLE_QKV_MERGE = "0"
SANA_EASYCACHE_THRESH = "0"
SANA_DISABLE_WARMUP = "0"
SGLANG_SANA_XATTN_KV_CACHE = "0"
SGLANG_SANA_BLOCK_EPILOGUE_FUSION = "0"
SGLANG_SANA_MODULATION_FUSION = "0"
SGLANG_SANA_NORM_MODULATION_FUSION = "0"
SGLANG_SANA_PAIRED_ROPE = "0"
SGLANG_SANA_FUSED_QKNORM_RELU_ROPE = "0"
SGLANG_SANA_FUSED_RECIPROCAL_SCALE = "0"
SANA_CACHE_FAMILY = "easycache"
SANA_CACHE_THRESHOLD = "0.10"
SANA_CACHE_WARMUP = "3"
SANA_CACHE_START = "0"
SANA_CACHE_END = "49"
SANA_CACHE_SUBSAMPLE = "8"
SANA_CACHE_MAX_HITS = "2"
SANA_TAYLOR_ORDER = "1"
SANA_TAYLOR_DAMPING = "1.0"
SANA_CACHE_DEBUG = "1"

[artifacts]
output_dir = "outputs"
video = "out.mp4"
log = "run.log"
benchmark = "benchmark.json"
frames_dir = "frames"
quality = "quality.json"
collection = "collection.json"
run_config = "run_config.json"
