id = "sana2b_cache_r10_tea_t0020_w3_s8_h1_balanced"
kind = "methodology"
purpose = "frontier"
description = "Round 10 first balanced TeaCache point, source-calibrated from the measured round-5 signal trace to target roughly 17-18 hits and a distinct 37-39 second band."
model_profile = "sana_video_2b_h100"

[env]
SANA_CACHE_FAMILY = "teacache"
SANA_CACHE_THRESHOLD = "0.020"
SANA_CACHE_WARMUP = "3"
SANA_CACHE_START = "0"
SANA_CACHE_END = "49"
SANA_CACHE_SUBSAMPLE = "8"
SANA_CACHE_MAX_HITS = "1"
SANA_TAYLOR_ORDER = "1"
SANA_TAYLOR_DAMPING = "1.0"
SANA_CACHE_DEBUG = "1"

[patch]
summary = "Use the faithful TeaCache signal with a one-hit cap and a preselected threshold intended to define the middle speed-quality tier between conservative and aggressive measurements."
touch_points = [
  "external/sol_runtime/python/sglang/multimodal_gen/runtime/cache/sana_video_cache.py",
  "external/sol_runtime/python/sglang/multimodal_gen/runtime/models/dits/sana_video.py",
]
off_identity_required = true
