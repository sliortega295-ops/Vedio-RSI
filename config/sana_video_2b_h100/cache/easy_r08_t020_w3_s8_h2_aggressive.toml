id = "sana2b_cache_r08_easy_t020_w3_s8_h2_aggressive"
kind = "methodology"
purpose = "frontier"
description = "Round 8 EasyCache aggressive point calibrated from round-2 transform-distance traces to target the 28.0-28.5 second Tea/Taylor band."
model_profile = "sana_video_2b_h100"

[env]
SANA_CACHE_FAMILY = "easycache"
SANA_CACHE_THRESHOLD = "0.20"
SANA_CACHE_WARMUP = "3"
SANA_CACHE_START = "0"
SANA_CACHE_END = "49"
SANA_CACHE_SUBSAMPLE = "8"
SANA_CACHE_MAX_HITS = "2"
SANA_TAYLOR_ORDER = "1"
SANA_TAYLOR_DAMPING = "1.0"
SANA_CACHE_DEBUG = "1"

[patch]
summary = "Raise EasyCache's native transform-distance threshold using the measured round-2 trace: early single hits followed by the two-hit cap pattern are expected to yield approximately 28 hits and match the aggressive Tea/Taylor time band."
touch_points = [
  "external/sol_runtime/python/sglang/multimodal_gen/runtime/cache/sana_video_cache.py",
  "external/sol_runtime/python/sglang/multimodal_gen/runtime/models/dits/sana_video.py",
]
off_identity_required = true
