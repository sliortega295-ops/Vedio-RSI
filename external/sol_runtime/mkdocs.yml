site_name: Sol-Engine
site_description: Accelerated video-diffusion inference — SANA-Video · Cosmos3-Super · LTX-2.3
site_author: Sol-Engine
site_url: https://lyttttt3333.github.io/sol-infer/
repo_name: lyttttt3333/sol-infer
docs_dir: site_docs
repo_url: https://github.com/lyttttt3333/sol-infer
theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/logo.png
plugins:
  - search
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
nav:
  - Overview: index.md
  - Getting Started:
      - Installation: installation.md
      - Model Zoo: model_zoo.md
  - Optimized pipelines:
      - SANA-Video: pipelines/sana.md
      - Cosmos3-Super: pipelines/cosmos3.md
      - LTX-2.3: pipelines/ltx.md
  - Acceleration techniques:
      - Cache (step-skip):
          - techniques/cache/index.md
          - TeaCache: techniques/cache/teacache.md
          - EasyCache: techniques/cache/easycache.md
          - TaylorSeer: techniques/cache/taylorseer.md
          - SCSP step-skip: techniques/cache/scsp.md
          - PAB: techniques/cache/pab.md
          - Cache-DiT: techniques/cache/cache_dit.md
      - Quantization:
          - techniques/quant/index.md
          - NVFP4: techniques/quant/nvfp4.md
          - FP8: techniques/quant/fp8.md
          - MXFP4 / MXFP8: techniques/quant/mxfp.md
          - SVDQuant (Nunchaku): techniques/quant/svdquant.md
          - SmoothQuant: techniques/quant/smoothquant.md
          - ViDiT-Q: techniques/quant/viditq.md
          - Q-DiT: techniques/quant/qdit.md
          - MixDQ: techniques/quant/mixdq.md
      - Kernel fusion (KWL):
          - techniques/kernel/index.md
          - Operator fusions: techniques/kernel/fusions.md
          - Compile & VAE: techniques/kernel/compile.md
          - Branch sharing: techniques/kernel/sharing.md
      - Sparse attention:
          - techniques/sparse/index.md
          - PISA: techniques/sparse/pisa.md
          - Sparse VideoGen (SVG/SVG2): techniques/sparse/svg.md
          - STA: techniques/sparse/sta.md
          - SpargeAttn: techniques/sparse/spargeattn.md
          - DraftAttention: techniques/sparse/draftattention.md
          - DiTFastAttn: techniques/sparse/ditfastattn.md
          - Other backends: techniques/sparse/others.md
      - Token pruning:
          - techniques/token_prune/index.md
          - ToMeSD: techniques/token_prune/tomesd.md
          - ToDo: techniques/token_prune/todo.md
          - AT-EDM: techniques/token_prune/atedm.md
          - DaTo: techniques/token_prune/dato.md
          - Video methods: techniques/token_prune/video.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lyttttt3333/sol-infer
  generator: false
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - stylesheets/extra.js
copyright: Copyright &copy; 2026 Sol-Engine
