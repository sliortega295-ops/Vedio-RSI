[[baseline.reference_only]]
name = "sglang_dependency_overlay"
path = "/share/project/shuchenweng/yongyan_liu/Experiments/SolRolloutBench/20260912-a100-eight/envs/sglang-overlay"
reason = "Read-only Python dependency overlay."

[experiment_defaults]
