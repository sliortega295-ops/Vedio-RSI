  "search/plan_eval.py",
  "orchestration/site_remote.py",
  "orchestration/site_job.py",
  "orchestration/site_transfer.py",
  "orchestration/site_observer.py",
  "orchestration/site_job_broker.py",
  "tools/vision/README.md",
  "tools/vision/lpips_judge.py",
  "techniques/config_manifest.py",
